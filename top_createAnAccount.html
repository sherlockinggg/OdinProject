<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="vishal joshy">
  <meta name="description" content="This is a web page for a page where details are collected to sign up">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="world-wide-web.png">
  <link rel="stylesheet" href="styles.css">
  <title>placeholder_website - create an account</title>
</head>
<body>
  <div class="ye">
    <img src="nature.jpg" alt="stock photo from stockvault.net">
  </div>
  <h1>Welcome to placeholder! Create an account</h1>
  <form onsubmit="return validatePasswords()">
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" placeholder="John" required>
  
    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
  
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="youremail@example.com" required>
  
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
  
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required minlength="6">
  
    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
  
    <button type="submit">Create Account</button>
  </form>

  <script>
    function validatePasswords() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return false; 
      }
      return true; 
    }
  </script>
</body>
</html>
